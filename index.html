<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz di Cultura Generale</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: right;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
            color: #721c24;
        }

        .option-btn[disabled] {
            cursor: default;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        .score-display {
            font-size: 24px;
            text-align: center;
            margin: 15px 0 5px 0;
            font-weight: bold;
        }

        .evaluation-display {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--primary-color);
            padding: 10px;
            border-radius: 8px;
            background-color: #e9f2ff;
        }

        .review-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .review-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .review-item.correct-item {
            border-left: 4px solid var(--correct-color);
            padding-left: 10px;
        }

        .review-item.wrong-item {
            border-left: 4px solid var(--wrong-color);
            padding-left: 10px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Schermata Iniziale -->
    <div id="start-screen" class="screen active">
        <h1>Quiz di Cultura Generale</h1>
        <p style="text-align: center; color: #666;">Metti alla prova le tue conoscenze! Rispondi a 10 domande estratte casualmente.</p>
        <button class="btn" onclick="startQuiz()">Inizia il Quiz</button>
    </div>

    <!-- Schermata Domanda -->
    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress">Domanda 1 di 10</div>
        <div class="question-text" id="question-text">Testo della domanda...</div>
        <div class="options-container" id="options-container">
            <!-- Opzioni dinamiche -->
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Prossima Domanda</button>
    </div>

    <!-- Schermata Finale -->
    <div id="result-screen" class="screen">
        <h2>Quiz Completato!</h2>
        <div class="score-display" id="score-display">Il tuo punteggio: 0 / 10</div>
        <div class="evaluation-display" id="evaluation-display">Giudizio...</div>
        <div id="review-container" class="review-list">
            <!-- Riepilogo risposte -->
        </div>
        <button class="btn" onclick="startQuiz()">Ricomincia Nuovo Quiz</button>
    </div>
</div>

    ];

    // Variabili di stato del gioco
    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    const TOTAL_QUESTIONS = 10; // Partita da 10 domande alla volta

    // Funzione per pescare N domande a caso
    function getRandomQuestions(array, n) {
        const shuffled = [...array].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, n);
    }

    function startQuiz() {
        selectedQuestions = getRandomQuestions(questionBank, TOTAL_QUESTIONS);
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];

        showScreen('quiz-screen');
        showQuestion();
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showQuestion() {
        const qData = selectedQuestions[currentQuestionIndex];
        
        document.getElementById('progress').innerText = `Domanda ${currentQuestionIndex + 1} di ${TOTAL_QUESTIONS}`;
        document.getElementById('question-text').innerText = qData.q;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        qData.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const qData = selectedQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        
        // Disabilita tutti i bottoni
        buttons.forEach(btn => btn.disabled = true);

        const isCorrect = (selectedIndex === qData.answer);
        
        // Salva risposta
        userAnswers.push({
            question: qData.q,
            selected: qData.options[selectedIndex],
            correct: qData.options[qData.answer],
            isCorrect: isCorrect
        });

        if (isCorrect) {
            score++;
            buttons[selectedIndex].classList.add('correct');
            document.getElementById('feedback').innerText = "Corretto! 🎉";
            document.getElementById('feedback').style.color = "var(--correct-color)";
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[qData.answer].classList.add('correct');
            document.getElementById('feedback').innerText = "Sbagliato! ❌";
            document.getElementById('feedback').style.color = "var(--wrong-color)";
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        showScreen('result-screen');
        document.getElementById('score-display').innerText = `Il tuo punteggio: ${score} / ${TOTAL_QUESTIONS}`;

        // Calcolo del giudizio finale
        const evalBox = document.getElementById('evaluation-display');
        if (score <= 4) {
            evalBox.innerText = "Giudizio: Insufficiente! 😅 Serve ripassare un po' di storia e cultura generale.";
            evalBox.style.color = "#dc3545";
            evalBox.style.backgroundColor = "#f8d7da";
        } else if (score <= 6) {
            evalBox.innerText = "Giudizio: Sufficiente / Mediocre! 🙂 Te la cavi, ma puoi fare di meglio.";
            evalBox.style.color = "#856404";
            evalBox.style.backgroundColor = "#fff3cd";
        } else if (score <= 8) {
            evalBox.innerText = "Giudizio: Bravo! 👏 Ottima conoscenza di cultura generale!";
            evalBox.style.color = "#004085";
            evalBox.style.backgroundColor = "#cce5ff";
        } else {
            evalBox.innerText = "Giudizio: Complimenti! 🏆 Un vero esperto di cultura generale!";
            evalBox.style.color = "#155724";
            evalBox.style.backgroundColor = "#d4edda";
        }

        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '<h3>Riepilogo Risposte:</h3>';

        userAnswers.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'correct-item' : 'wrong-item'}`;
            
            let content = `<strong>${idx + 1}. ${item.question}</strong><br>`;
            if (item.isCorrect) {
                content += `<span style="color: var(--correct-color)">Risposta: ${item.selected} ✔</span>`;
            } else {
                content += `<span style="color: var(--wrong-color)">Tua risposta: ${item.selected} ✖</span><br>`;
                content += `<span style="color: var(--correct-color)">Risposta corretta: ${item.correct}</span>`;
            }
            
            div.innerHTML = content;
            reviewContainer.appendChild(div);
        });
    }
</script>
