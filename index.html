        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;

        h1 {

            margin-bottom: 20px;

        .progress {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 15px;
            text-align: right;
        }
        .question {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #34495e;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-option {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;

        .btn-option:hover {

        .result-screen {

            font-size: 1.3em;
            font-weight: bold;
            padding: 10px 15px;
            background-color: #f39c12;
            color: white;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-restart {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;

        .btn-restart:hover {

        }
        .hide {

        <div class="options" id="options-container">
            <!-- Bottoni opzioni generati dinamicamente -->
        </div>
    </div>

    <!-- Schermata Risultato -->
    <div id="result-screen" class="result-screen hide">
        <h2>Risultato Finale</h2>
        <p>Hai risposto correttamente a:</p>
        <div class="score" id="final-score">0 / 10</div>
        <p>Il tuo livello di cultura è:</p>
        <div class="level-badge" id="culture-level">-</div>
        <br><br>
        <button class="btn-restart" onclick="startQuiz()">Gioca di Nuovo 🔄</button>
    </div>
</div>

let selectedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startQuiz() {
    score = 0;
    currentQuestionIndex = 0;
    
    // Mescola e seleziona 10 domande casuali
    let dbCopy = JSON.parse(JSON.stringify(rawDatabase));
    shuffleArray(dbCopy);
    selectedQuestions = dbCopy.slice(0, 10);

    document.getElementById('quiz-screen').classList.remove('hide');
    document.getElementById('result-screen').classList.add('hide');
    
    showQuestion();
}

function showQuestion() {
    const q = selectedQuestions[currentQuestionIndex];
    document.getElementById('progress').innerText = `Domanda ${currentQuestionIndex + 1} di 10`;
    document.getElementById('question-text').innerText = q.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    // Prepariamo le opzioni mantenendo la risposta corretta tracciata
    let opts = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correct }));
    shuffleArray(opts); // Mescoliamo l'ordine delle opzioni

    opts.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = option.text;
        btn.onclick = () => selectOption(option.isCorrect);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(isCorrect) {
    if (isCorrect) {
        score++;
    }
    
    currentQuestionIndex++;
    if (currentQuestionIndex < 10) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').classList.add('hide');
    document.getElementById('result-screen').classList.remove('hide');
    
    document.getElementById('final-score').innerText = `${score} / 10`;
    
    // Calcolo del livello culturale
    let level = "";
    if (score === 10) level = "🏆 Genio Enciclopedico";
    else if (score >= 8) level = "🧠 Cultura Superiore";
    else if (score >= 6) level = "📚 Buona Cultura Generale";
    else if (score >= 4) level = "🐣 Livello Base / In Erba";
    else level = "✏️ Da Ripassare";
    
    document.getElementById('culture-level').innerText = level;
}

// Avvio automatico all'apertura della pagina
startQuiz();
